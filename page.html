---
layout: default
---
<article class="article">
  <div class="wrap">
    <div class="article-head">
      <h1>{{ page.title }}</h1>
      {% if page.summary %}<p class="summary">{{ page.summary }}</p>{% endif %}
      <div class="facts">
        {% if page.company %}<span>{{ page.company }}</span>{% endif %}
        {% if page.role %}<span>{{ page.role }}</span>{% endif %}
        {% if page.period %}<span>{{ page.period }}</span>{% endif %}
      </div>
    </div>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
