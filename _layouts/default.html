<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}, senior product manager{% endif %}</title>
<meta name="description" content="{{ page.summary | default: site.description | strip_newlines | truncate: 200 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0EBE2; --paper-deep:#E8E2D7; --block:#1B1712;
  --ink:#1E1A16; --body:#3A342C; --muted:#6E655A;
  --rule:#C9BFAF; --rule-soft:#DAD2C5;
  --link:#1B4D5A; --highlight:#BFD9DB;
  --on-block:#F7F3EC; --on-block-dim:#C4BAAC; --on-block-mute:#9C9184;
  --serif:"Newsreader",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --measure:36rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:19px;line-height:1.64;font-weight:300;font-optical-sizing:auto}
.wrap{max-width:62rem;margin:0 auto;padding:0 2.5rem}

.band{background:var(--block);color:var(--on-block);padding:1.9rem 0 3.4rem}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:2rem;flex-wrap:wrap;padding-bottom:3.2rem}
.mast .name{font-family:var(--sans);font-size:.88rem;font-weight:500;color:var(--on-block);text-decoration:none}
.mast nav{font-family:var(--sans);font-size:.83rem}
.mast nav a{color:var(--on-block-mute);text-decoration:none;margin-left:1.5rem}
.mast nav a:hover{color:var(--on-block);text-decoration:underline;text-underline-offset:3px}

.band h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.15rem,5.4vw,3.35rem);
  line-height:1.06;letter-spacing:-.026em;margin:0 0 1.35rem;max-width:18ch;color:var(--on-block)}
.band .standfirst{max-width:var(--measure);margin:0;color:var(--on-block-dim);font-size:1.02rem}
.band .facts{font-family:var(--sans);font-size:.8rem;color:var(--on-block-mute);line-height:1.85;margin-top:1.6rem}
.band .facts span{display:block}

h2.section{font-family:var(--sans);font-size:.83rem;font-weight:500;color:var(--ink);margin:3.6rem 0 .3rem}
main>.wrap>h2.section:first-child{margin-top:3rem}
.rows{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:9rem 1fr;gap:2.2rem;padding:1.15rem 0;border-top:1px solid var(--rule)}
.row .label{font-family:var(--sans);font-size:.78rem;line-height:1.5;color:var(--muted);padding-top:.4rem}
.row .body{color:var(--body);font-size:1.01rem;max-width:var(--measure)}
.row .body>*:first-child{margin-top:0}
.row .body>*:last-child{margin-bottom:0}
.row h3{font-family:var(--serif);font-weight:500;font-size:1.32rem;line-height:1.26;
  letter-spacing:-.015em;margin:0 0 .45rem;color:var(--ink)}
.row h3 a{color:var(--ink);text-decoration:none;box-shadow:inset 0 -.42rem 0 var(--highlight)}
.row h3 a:hover{box-shadow:inset 0 -1.15rem 0 var(--highlight)}
.row.draft h3{color:var(--muted);font-weight:400;font-style:italic}
.status{display:block;font-family:var(--sans);font-size:.72rem;color:var(--muted);margin-top:.55rem}

.article{padding:3.2rem 0 1rem}
.prose{max-width:var(--measure)}
.prose h2{font-family:var(--serif);font-weight:500;font-size:1.46rem;line-height:1.28;
  letter-spacing:-.015em;margin:3rem 0 .85rem}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 1.15rem;color:var(--body)}
.prose ul{margin:0 0 1.3rem;padding-left:1.15rem;color:var(--body)}
.prose li{margin-bottom:.55rem}
.prose strong{font-weight:500;color:var(--ink)}
.prose hr{border:0;border-top:1px solid var(--rule);margin:2.6rem 0}
.prose a{color:var(--link)}
.prose img{display:block;width:100%;height:auto;margin:2.1rem 0 .65rem;
  border:1px solid var(--rule);background:#fff}
.prose p>em:only-child{display:block;font-family:var(--sans);font-style:normal;
  font-size:.79rem;color:var(--muted);line-height:1.65;max-width:30rem;margin-bottom:2.1rem}
@media (min-width:66rem){
  .prose p:has(> img){margin-left:-6rem;width:calc(100% + 6rem)}
  .prose p:has(> img) + p > em:only-child{margin-left:-6rem}
}

footer{margin-top:4.5rem;background:var(--paper-deep);border-top:1px solid var(--rule);padding:2.1rem 0 3.6rem}
footer .wrap{display:flex;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;
  font-family:var(--sans);font-size:.81rem;color:var(--muted)}
footer a{color:var(--muted)}
footer a:hover{color:var(--link)}
a:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.band a:focus-visible{outline-color:var(--highlight)}

@media (max-width:46rem){
  body{font-size:18px}
  .wrap{padding:0 1.4rem}
  .band{padding:1.5rem 0 2.6rem}
  .mast{padding-bottom:2.2rem}
  .mast nav a{margin-left:0;margin-right:1.2rem}
  .row{grid-template-columns:1fr;gap:.5rem;padding:1.2rem 0}
  .row .label{padding-top:0}
  .prose img{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
{{ content }}
<footer>
  <div class="wrap">
    <div>Ashish Srivastava, senior product manager. Gurugram, India.</div>
    <div><a href="mailto:{{ site.email }}">{{ site.email }}</a></div>
  </div>
</footer>
</body>
</html>
